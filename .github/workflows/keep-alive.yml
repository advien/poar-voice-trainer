name: Supabase keep-alive

# Free-tier Supabase pauses a project after ~7 days of inactivity.
#
# Lessons from the July 2026 freeze:
#   1. GitHub silently drops/delays scheduled runs on low-activity repos, so
#      a 5-day cadence left >7-day gaps. We now run DAILY — losing a few runs
#      no longer matters.
#   2. The project froze within 4 days of a successful read-only ping, so a
#      plain SELECT is not reliably counted as activity. We now perform a
#      real WRITE via the keepalive_ping() RPC (see supabase/keepalive.sql),
#      plus the original read as a fallback signal.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY (anon is public-safe).

on:
  schedule:
    # Daily at 06:17 UTC. Off the top of the hour — GitHub sheds less load
    # at odd minutes, so the run is less likely to be delayed or dropped.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write-ping via keepalive_ping() RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secrets."
            exit 1
          fi

          # 1) Real database WRITE — unambiguous activity.
          code=$(curl -sS --max-time 30 -o /tmp/rpc.txt -w "%{http_code}" \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "RPC keepalive_ping → HTTP ${code}: $(cat /tmp/rpc.txt)"

          # 2) Fallback read (kept from the original workflow).
          rcode=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/questions?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Read questions → HTTP ${rcode}"

          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::Write-ping failed (HTTP ${code}). If the project is paused, restore it in the Supabase dashboard and run supabase/keepalive.sql."
            exit 1
          fi
          echo "Project pinged with a real write — stays awake."
