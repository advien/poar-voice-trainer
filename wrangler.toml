# =============================================================================
# Cloudflare Workers config for POAR Voice Trainer
# Deployed via @opennextjs/cloudflare: `npm run cf:build` -> `npm run cf:deploy`.
#
# Secrets (OPENAI_API_KEY, SUPABASE_SERVICE_ROLE_KEY) are set with
# `wrangler secret put`, never here. The NEXT_PUBLIC_* values are plaintext
# variables kept in the Cloudflare dashboard.
# =============================================================================

name = "poar-voice-trainer"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# Preserve plaintext variables set in the dashboard across deploys. Without it,
# `wrangler deploy` resets the worker's vars to match `[vars]` in this file —
# silently wiping the NEXT_PUBLIC_* values on every push. Secrets are managed
# separately and are unaffected.
keep_vars = true

# The app answers on voice-trainer.advien.tech; the *.workers.dev address was
# only ever the way in before the domain existed. Preview URLs are a separate
# setting and stay on, so pull-request builds still get a link to check.
workers_dev = false
preview_urls = true

# Asset bindings emitted by @opennextjs/cloudflare's build step.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# Required by `wrangler preview`, which Workers Builds runs for pull requests.
# The block may be empty: assets, compatibility settings and placement stay at
# the top level. Without it the preview step fails while the build succeeds.
[previews]
